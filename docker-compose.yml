# Local environment (architecture section 10). Copy .env.example to .env and fill in its values first.
name: payment-webhook-processor

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # The emulator keeps its own databases in the same SQL Server instance the app uses.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      # Host port 5673, not 5672, so it does not clash with a locally installed RabbitMQ.
      - "5673:5672"
      - "5300:5300"
    volumes:
      - ./infra/servicebus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      sqlserver:
        condition: service_healthy

  # Build context is the repo root because Directory.Build.props and the project references live there.
  api:
    build:
      context: .
      dockerfile: src/Payments.Api/Dockerfile
    # Development turns on the OpenAPI document and Swagger UI; the cloud runs as Production.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
      Admin__ApiKey: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      # The emulator's fixed, public development key, not a secret. The queue name comes from appsettings.Development.json.
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus:5672;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    ports:
      - "8080:8080"
    depends_on:
      - servicebus

  # Runs once and exits: applies the EF Core migrations, creating the Payments database on the first run.
  migrator:
    build:
      context: .
      dockerfile: src/Payments.Migrator/Dockerfile
    environment:
      ConnectionStrings__Payments: "Server=sqlserver;Database=Payments;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Payments.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      # The emulator's fixed, public development key, not a secret. The queue name comes from appsettings.Development.json.
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus:5672;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      ConnectionStrings__Payments: "Server=sqlserver;Database=Payments;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      # Local demos only: payments with the demo_fault metadata fail on purpose (architecture section 6).
      FaultInjection__Enabled: "true"
    # Waits for the schema, so the worker never meets a database without the tables.
    depends_on:
      servicebus:
        condition: service_started
      migrator:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
