name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads global.json so CI builds with the same SDK band as local machines.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~Payments.IntegrationTests" --logger "console;verbosity=normal"

      # SQL Server and the Service Bus emulator in Docker; a hung container fails the step instead of the 6 h job limit.
      - name: Integration tests
        timeout-minutes: 15
        run: dotnet test tests/Payments.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"
